schema = "pdf-json-markdown-reimplementation-fixtures-v1"
java_version = "OpenJDK 25.0.2 (GraalVM Community)"
java_artifact = "java/opendataloader-pdf-cli/target/opendataloader-pdf-cli-2.5.13-SNAPSHOT.jar"
build_command = "mvn -f java/pom.xml -pl opendataloader-pdf-cli -am package -DskipTests"
generation_command = "java -jar <jar> --quiet --format json --format markdown --image-output external --output <output-dir> --image-dir <output-dir>/images <pdf>"

# Every successful case was generated by the Java artifact above. Existing
# lorem outputs are retained as the baseline and were byte-compared with a
# fresh generation.

[[case]]
name = "lorem"
pdf = "samples/pdf/lorem.pdf"
json = "samples/json/lorem.json"
markdown = "samples/markdown/lorem.md"
json_sha256 = "045420ac5cc4426593bb844d7575a2d5b6e1bc31c5d3d9c48eecfa55e27de658"
markdown_sha256 = "87c6223a292cd1c8fd716ca749dfb1c6c5ff019ac08d33cc91683255317f58d3"
covers = ["metadata", "heading", "paragraph", "json", "markdown", "baseline"]

[[case]]
name = "multipage"
pdf = "samples/pdf/2408.02509v1.pdf"
json = "samples/oracle/multipage/2408.02509v1.json"
markdown = "samples/oracle/multipage/2408.02509v1.md"
json_sha256 = "07befb22f554b955664a832e5f7877b65e29db2310fb072c0938939b84e9cb2f"
markdown_sha256 = "7e66a3c274fe56d13932c2d71bbfecfa6a1b3809a74940c6738fcdab495b51f9"
covers = ["page-order", "cross-page-content", "reading-order", "ids"]

[[case]]
name = "table"
pdf = "samples/pdf/issue-336-conto-economico-bialetti.pdf"
json = "samples/oracle/table/issue-336-conto-economico-bialetti.json"
markdown = "samples/oracle/table/issue-336-conto-economico-bialetti.md"
json_sha256 = "2cb3c0d6fcfc7a1a762cb17da5fa3c0ff7c552188f5680b38804f3fcb0b73921"
markdown_sha256 = "c8cd842563c3c8a99013fa05c7adbe5e1d51fc93067b63ec5a438420248294ac"
covers = ["table", "table-cells", "line-art-omission"]

[[case]]
name = "raster"
pdf = "samples/pdf/chinese_scan.pdf"
json = "samples/oracle/raster/chinese_scan.json"
markdown = "samples/oracle/raster/chinese_scan.md"
images = ["samples/oracle/raster/images/imageFile1.png"]
json_sha256 = "e453c314f5196c1ed611c80d29c5b84a2802bb0b6d76d8a93107db8652909608"
markdown_sha256 = "e54a9bf173001b9c7c0929389965b56dd99776dc8a5ab4c1fa8884a81ca8929c"
image_sha256 = "c5603f9a4369a58e46ec3bbc9fd7b2ed09bdd44711d7d399293d95ae80c94c8c"
covers = ["raster-only-page", "image-chunk", "external-image-output"]

[[case]]
name = "sanitization"
pdf = "samples/pdf/sanitization-targets.pdf"
json = "samples/oracle/sanitization/sanitization-targets.json"
markdown = "samples/oracle/sanitization/sanitization-targets.md"
json_sha256 = "b992dabe55479dac9a1577a55119ec5ab30ca2fee2bc3c45a56f33077dcf2463"
markdown_sha256 = "856cc3edb688eef292a34abba2dfcb30568794ef2fb4c81d024f2ec72b1e5c37"
covers = ["text-cleanup", "destination-sanitization"]

[[case]]
name = "invalid-chars"
pdf = "samples/pdf/invalid-chars.pdf"
json = "samples/oracle/invalid-chars/invalid-chars.json"
markdown = "samples/oracle/invalid-chars/invalid-chars.md"
json_sha256 = "57bbeb580794135712e13318b43bba545498cedbc4e69f9ceecdaac237784276"
markdown_sha256 = "0d1854d77b052ee39d3cc12896bc5c12ba58559e8ee88a6cda100b71ff672b3f"
covers = ["undefined-character-handling"]

[[case]]
name = "invalid-input"
pdf = "samples/pdf/fake-jpg.pdf"
expected_result = "error: not a valid PDF file (missing %PDF- header)"
covers = ["invalid-input-error"]

[[case]]
name = "password-protected"
pdf = "samples/pdf/password-protected.pdf"
expected_result = "error: password-protected; use --password option"
covers = ["password-error"]

[coverage]
F1 = ["lorem", "multipage", "table", "raster", "sanitization", "invalid-chars", "invalid-input", "password-protected"]
M1 = ["lorem", "multipage", "table", "raster"]
P1 = ["lorem", "multipage", "raster", "invalid-input", "password-protected"]
C1 = ["sanitization", "invalid-chars"]
S1 = ["lorem", "multipage"]
T1 = ["table"]
I1 = ["raster"]
R1 = ["multipage"]
J1 = ["lorem", "multipage", "table", "raster"]
D1 = ["lorem", "multipage", "table", "raster"]
O1 = ["lorem", "multipage", "raster"]
V1 = ["lorem", "multipage", "table", "raster", "sanitization", "invalid-chars"]
X1 = ["lorem", "multipage", "table", "raster"]

# V1 traceability. Partial items keep their remaining parity gap explicit.
[[checklist]]
id = 1
status = "partial"
implementation = ["crates/opendataloader_core/src/parser.rs::parse_document", "crates/opendataloader_core/src/model.rs::ConversionError"]
fixtures = ["invalid-input", "password-protected"]
tests = ["parser::tests::parser_distinguishes_invalid_and_password_inputs"]
blocker = "No committed truncated/corrupt-body PDF fixture yet; lopdf failures map to invalid input but lack oracle-backed coverage."

[[checklist]]
id = 2
status = "partial"
implementation = ["crates/opendataloader_core/src/parser.rs::read_metadata", "crates/opendataloader_core/src/parser.rs::xmp_metadata"]
fixtures = ["lorem", "multipage"]
tests = ["parser::tests::parser_reads_lorem_metadata_pages_and_text"]
blocker = "Committed PDFs exercise PDF information metadata but not XMP-only fallback."

[[checklist]]
id = 3
status = "pass"
implementation = ["crates/opendataloader_core/src/parser.rs::parse_document", "crates/opendataloader_core/src/lib.rs::parse_pdf"]
fixtures = ["lorem", "multipage", "raster"]
tests = ["parser::tests::parser_preserves_raster_image_chunk_without_text"]

[[checklist]]
id = 4
status = "partial"
implementation = ["crates/opendataloader_core/src/reading_order.rs::apply", "crates/opendataloader_core/src/reading_order.rs::assign_ids"]
fixtures = ["multipage"]
tests = ["reading_order::tests::xycut_order_and_ids_are_deterministic", "reading_order::tests::off_preserves_parser_order_and_assigns_ids"]
blocker = "The parser lacks reliable per-text coordinates, so exact XY-Cut++ multi-column parity is deferred."

[[checklist]]
id = 5
status = "partial"
implementation = ["crates/opendataloader_core/src/cleanup.rs::normalize_page_chunks", "crates/opendataloader_core/src/semantics.rs::reconstruct_semantics"]
fixtures = ["sanitization", "invalid-chars", "lorem", "table"]
tests = ["cleanup::tests::parser_applies_fixture_text_cleanup", "semantics::tests::reconstructs_heading_paragraph_and_unordered_list", "semantics::tests::reconstructs_border_table_rows_cells_and_headers"]
blocker = "Nested/cross-page lists, captions, repeated headers/footers, and several Java filters need parser metadata or geometry not preserved by the current boundary."

[[checklist]]
id = 6
status = "partial"
implementation = ["crates/opendataloader_core/src/json.rs::serialize_document", "crates/opendataloader_core/src/json.rs::element_value"]
fixtures = ["lorem", "multipage", "table", "raster"]
tests = ["json::tests::serializes_root_nulls_and_image_fixture_shape", "json::tests::serializes_nested_table_rows_and_cells"]
blocker = "Exact Java comparisons for every semantic kind are not fixture-backed; formula, caption, and TOC inputs are absent."

[[checklist]]
id = 7
status = "partial"
implementation = ["crates/opendataloader_core/src/markdown.rs::serialize_markdown", "crates/opendataloader_core/src/markdown.rs::render"]
fixtures = ["lorem", "multipage", "table", "raster", "sanitization"]
tests = ["markdown::tests::renders_supported_elements_with_exact_separators", "markdown::tests::renders_lists_tables_and_sanitized_images"]
blocker = "Focused exact-byte tests exist, but the parser cannot produce all Java semantic cases needed for complete fixture parity."

[[checklist]]
id = 8
status = "partial"
implementation = ["crates/opendataloader_core/src/images.rs::write_external_images", "crates/opendataloader_core/src/lib.rs::convert"]
fixtures = ["raster"]
tests = ["images::tests::external_images_write_png_and_reference_written_file", "tests::convert_writes_requested_outputs_from_one_document"]
blocker = "The success path is fixture-backed; isolated post-directory image-write failure lacks a deterministic committed fixture."

[[checklist]]
id = 9
status = "blocked"
implementation = ["crates/opendataloader_core/src/model.rs::ImageReference", "crates/opendataloader_core/src/json.rs::element_value"]
fixtures = ["raster"]
blocker = "Base64 image output is explicitly deferred; the current path emits no data URI and supports external references only."
