name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to create a release for
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Build shared library and Python distributions
        run: |
          cargo build --release --package opendataloder_clib
          cp target/release/libopendataloder_clib.so packages/opendataloader/src/opendataloader/libodl.so
          uv build --package opendataloader --out-dir dist

      - name: Build CLI binary archive
        run: |
          cargo build --release --package opendataloder_cli
          tar -czf dist/opendataloder_cli-linux-x86_64.tar.gz \
            -C target/release opendataloder_cli

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
